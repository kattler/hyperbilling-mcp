{{- if and (include "hyperbilling-mcp.fallbackEnabled" .) (not .Values.hyperbilling.clientId) }}
{{- fail "hyperbilling.clientId is required when a fallback Open API key is configured" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "hyperbilling-mcp.fullname" . }}
  labels:
    {{- include "hyperbilling-mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  revisionHistoryLimit: {{ .Values.revisionHistoryLimit }}
  strategy:
    {{- toYaml .Values.strategy | nindent 4 }}
  selector:
    matchLabels:
      {{- include "hyperbilling-mcp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "hyperbilling-mcp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "hyperbilling-mcp.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      containers:
        - name: {{ .Chart.Name }}
          image: {{ include "hyperbilling-mcp.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.extraEnvFrom }}
          envFrom:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: LISTEN_PORT
              value: {{ .Values.ports.http | quote }}
            - name: METRICS_PORT
              value: {{ .Values.ports.metrics | quote }}
            - name: HYPERBILLING_URL
              value: {{ .Values.hyperbilling.url | quote }}
            - name: HYPERBILLING_REQUEST_TIMEOUT_SECONDS
              value: {{ .Values.hyperbilling.requestTimeoutSeconds | quote }}
            - name: DOCS_ENABLED
              value: {{ .Values.docs.enabled | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- if include "hyperbilling-mcp.fallbackEnabled" . }}
            - name: HYPERBILLING_CLIENT_ID
              value: {{ .Values.hyperbilling.clientId | quote }}
            - name: HYPERBILLING_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "hyperbilling-mcp.secretName" . }}
                  key: {{ include "hyperbilling-mcp.secretKey" . }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.ports.http }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.ports.metrics }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.resizePolicy }}
          resizePolicy:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- range . }}
        - {{ toYaml . | nindent 10 | trim }}
          {{- if not .labelSelector }}
          labelSelector:
            matchLabels:
              {{- include "hyperbilling-mcp.selectorLabels" $ | nindent 14 }}
          {{- end }}
        {{- end }}
      {{- end }}
