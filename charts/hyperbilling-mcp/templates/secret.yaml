{{- if and (not .Values.hyperbilling.existingSecret) .Values.hyperbilling.clientSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "hyperbilling-mcp.secretName" . }}
  labels:
    {{- include "hyperbilling-mcp.labels" . | nindent 4 }}
type: Opaque
stringData:
  HYPERBILLING_CLIENT_SECRET: {{ .Values.hyperbilling.clientSecret | quote }}
{{- end }}
