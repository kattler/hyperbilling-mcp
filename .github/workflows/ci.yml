name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: 1.100.0
          components: rustfmt, clippy, llvm-tools-preview

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-ci-${{ hashFiles('Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Install cargo-llvm-cov and cargo-audit
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: cargo-llvm-cov,cargo-audit

      - name: Run tests with coverage (minimum 70%)
        run: cargo llvm-cov --locked --fail-under-lines 70

      - name: Audit the lockfile
        run: cargo audit

  chart:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
        with:
          version: v4.3.1

      - name: Lint chart
        run: helm lint --strict charts/hyperbilling-mcp

      - name: Render chart
        run: |
          helm template hyperbilling-mcp charts/hyperbilling-mcp > /dev/null
          helm template hyperbilling-mcp charts/hyperbilling-mcp \
            --set hyperbilling.clientId=user@example.com \
            --set hyperbilling.existingSecret=hyperbilling-mcp \
            --set serviceMonitor.enabled=true > /dev/null
          helm template hyperbilling-mcp charts/hyperbilling-mcp \
            --api-versions gateway.networking.k8s.io/v1/HTTPRoute \
            --set httpRoute.enabled=true \
            --set 'httpRoute.parentRefs[0].name=external' \
            --set ingress.enabled=true > /dev/null

  lint:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Run hadolint
        env:
          HADOLINT_IMAGE: ghcr.io/hadolint/hadolint:v2.15.1
        run: docker run --rm -i "${HADOLINT_IMAGE}" < Dockerfile

      - name: Run actionlint
        env:
          ACTIONLINT_IMAGE: rhysd/actionlint:1.7.9
        run: docker run --rm -v "${PWD}:/repo" -w /repo "${ACTIONLINT_IMAGE}" -color

      - name: Run shellcheck
        run: shellcheck .github/scripts/*.sh
