[package]
name = "hyperbilling-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.100.1"
authors = ["younsl <cysl@kakao.com>"]
license = "Apache-2.0"
description = "Model Context Protocol server for the Megazone HyperBilling Open API"
readme = "README.md"
repository = "https://github.com/kattler/hyperbilling-mcp"

[lib]
name = "hyperbilling_mcp"
path = "src/lib.rs"

[[bin]]
name = "hyperbilling-mcp"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }

axum = { version = "0.8", default-features = false, features = ["tokio", "http1"] }
http = "1.5"

reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs"] }

rmcp = { version = "3.11.0", features = ["server", "transport-streamable-http-server", "schemars", "macros"] }
schemars = "1.2"

serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

clap = { version = "4.5", features = ["derive", "env"] }

anyhow = "1.0"
thiserror = "2.0"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

prometheus-client = "0.26"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Internal library behind one binary, not a published API
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Tool and argument docs are JSON schema text for the agent, full of API field names
doc_markdown = "allow"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
